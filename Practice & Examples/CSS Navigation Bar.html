<!DOCTYPE html>
<html lang ="eng">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content=""width=device-width, initial-scale="1.0">
        <title>CSS Navigation Bar</title> <!--margin, border, padding, box-->

        <style>
            * {
                margin: 0px;
                padding: 0px;
            }

            ul {
                list-style-type: none;
                margin: 0;
                padding: 0;
                overflow: hidden;
                background-color: black;  
                position: fixed;            /*keeps the nav bar at the top*/
                top: 0;                     /*lists the top as the top*/
                width: 100%;
                height: 50px;
            }

            li {
                float: left;
            }

            li a {
                display: block;
                color: white;
                text-align: center;
                padding: 15px 16px;
                text-decoration: none;
            }

            .active {
                background-color: aquamarine;
                color: black;
            }

            li a:hover {
                background-color: antiquewhite;
                color: black;
            }

            .random {
                height: 100px;
                background-color: bisque;
                color: slategrey;
                border: 10px solid black;
            }
        </style>
    </head>
    <body>
        <ul>
            <li><a class="active" href="#home">Home</a></li> <!--<a> = "anchor element", for hyperlinks-->
            <li><a href="#mission">Mission Statement</a></li>
            <li><a href="#news">News</a></li>
            <li><a href="#contact">Contact Us</a></li>
            <li><a href="#support">Support Us</a></li>
        </ul>

        <div class="random">
            Some random data
        </div>
        <div class="random">
            Some random data
        </div>

            Some random data
        </div>

            Some random data
        </div>

            Some random data
        </div>
        <div class="random">
            Some random data
        </div>
        <div class="random">
            Some random data
        </div>
        <div class="random">
            Some random data
        </div>
    </body>
</html>
