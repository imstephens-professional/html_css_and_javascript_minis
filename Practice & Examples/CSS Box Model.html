<!DOCTYPE html>
<html lang ="eng">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content=""width=device-width, initial-scale="1.0">
        <title>CSS Box Model</title> <!--margin, border, padding, box-->
        
        <style>
            * {
                margin: 0px;
                padding: 0px;
            }

            #one {
                height: 100px;
                background-color: aqua;
                padding: 10px 50px 5px 100px; /*MAKE SURE TO PUT THE numpx together, not num px */
                border: 10px solid black;
                margin: 20px;
                
            }

            #two {
                height: 50px;
                background-color: rgb(206, 177, 205);
                margin: 50px;
            }
        </style>
    </head>
    <body>
        <div id="one">
            One rara
        </div>

        <div id="two">
            Two
        </div>
    </body>
</html>
