<!DOCTYPE html>
<html lang ="eng">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content=""width=device-width, initial-scale="1.0">
        <title>CSS Forms</title> 

        <style>
            * {
                margin: 0px;
                padding: 0px;
            }

            input[type=text], select {
                width: 100%;
                padding: 12px 20px;
                margin: 8px 0;
                display: inline-block;
                background-color: white;
                border: 1px solid salmon;
                border-radius: 4px;
                box-sizing: border-box;
            }

            input[type=number] {
                width: 100%;
                padding: 12px 20px;
                margin: 8px 0;
                display: inline-block;
                background-color: white;
                border: 1px solid salmon;
                border-radius: 4px;
                box-sizing: border-box;
            }

            input[type=submit] {
                width: 100%;
                background-color: crimson;
                color:floralwhite;
                padding: 14px 20px;
                margin: 8px 0;
                border: none;
                cursor: pointer;
            }

            input[type=submit]:hover {
                background-color: floralwhite;
                color: crimson;
                border: 1px solid crimson;
            }

            div {
                border-radius: 5px;
                background-color: rgb(240, 236, 236);
                padding: 20px;
            }
        </style>
    </head>
    <body>
        <div>
            <form>
                <label for="fname">First Name</label>
                <input type="text" id="fname" name="firstname" placeholder="Write here..."/>
                
                <label for="lname">Last Name</label>
                <input type="text" id="lname" name="lastname" placeholder="Write here..."/>

                <label for="country">Country</label>
                <select id="country">
                    <option value="aus">Australia</option>
                    <option value="uk">United Kingdom</option>
                    <option value="usa">United States of America</option>
                    <option value="it">Italy</option>
                    <option value="jpn">Japan</option>
                    <option value="chn">China</option>
                    <option value="oth">Other</option>
                </select>

                <label for="age">Age</label>
                <input type="number" id="age" max="120" min="1" placeholder="Number here..."/>

                <label for="sex">Sex at Birth</label>
                <select id="sex">
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>

                <input type="submit" value="Submit"/>
            </form>
        </div>
        
    </body>
</html>
