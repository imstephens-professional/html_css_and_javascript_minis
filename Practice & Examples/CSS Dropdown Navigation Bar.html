<!DOCTYPE html>
<html lang ="eng">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content=""width=device-width, initial-scale="1.0">
        <title>CSS Dropdown Navigation Bar</title> 

        <style>
            * {
                margin: 0px;
                padding: 0px;
            }

            .dropdown {
                position: relative;
                display: inline-block;
            }

            .dropdown-content {
                display: none;
                position: absolute;
                z-index: 1; /*how close the element is to the viewer*/
                box-shadow: 0px 8px 16px 0px rgb(209, 205, 205);
                padding: 20px;
            }

            .dropdown:hover .dropdown-content {
                display: block;
            }

            .dropbtn {
                border: none;
                padding: 20px;
                background-color: aquamarine;
                color: black;
            }

            a {
                display: block;
            }
        </style>
    </head>
    <body>
        <div class="dropdown">
            <button class="dropbtn">Dropdown</button>
            <div class="dropdown-content">
                <a href="#">Mission Statement</a>
                <a href="#">News</a>
                <a href="#">Contact Us</a>
                <a href="#">Support Us</a>
            </div>
        </div>
    </body>
</html>
